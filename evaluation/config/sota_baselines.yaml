# State-of-the-art baseline results from published papers
# =======================================================
# Values are mean metrics across DTU benchmark scenes
# Source papers cited for each method

methods:
  # Neural Implicit Methods
  NeuS:
    accuracy: 0.83
    completeness: 1.37
    overall: 1.10
    source: "Wang et al., NeurIPS 2021"
    category: "neural_implicit"

  VolSDF:
    accuracy: 0.97
    completeness: 1.26
    overall: 1.12
    source: "Yariv et al., NeurIPS 2021"
    category: "neural_implicit"

  NeuralWarp:
    accuracy: 0.49
    completeness: 0.71
    overall: 0.60
    source: "Darmon et al., CVPR 2022"
    category: "neural_implicit"

  Neuralangelo:
    accuracy: 0.37
    completeness: 0.36
    overall: 0.37
    source: "Li et al., CVPR 2023"
    category: "neural_implicit"

  # Gaussian Splatting Methods
  3DGS:
    accuracy: 1.30
    completeness: 1.52
    overall: 1.41
    source: "Kerbl et al., SIGGRAPH 2023"
    category: "gaussian_splatting"

  2DGS:
    accuracy: 0.48
    completeness: 0.43
    overall: 0.45
    source: "Huang et al., SIGGRAPH 2024"
    category: "gaussian_splatting"

  SuGaR:
    accuracy: 0.76
    completeness: 0.72
    overall: 0.74
    source: "Guédon et al., CVPR 2024"
    category: "gaussian_splatting"

  GOF:
    accuracy: 0.45
    completeness: 0.41
    overall: 0.43
    source: "Yu et al., NeurIPS 2024"
    category: "gaussian_splatting"

  # Multi-View Stereo Methods
  COLMAP:
    accuracy: 0.40
    completeness: 0.65
    overall: 0.52
    source: "Schönberger et al., CVPR 2016"
    category: "mvs"

